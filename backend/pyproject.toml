[project]
name = "ai-trading-dashboard-backend"
version = "0.1.0"
description = "Explainable, risk-aware NSE/BSE trading intelligence backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "yfinance>=1.7.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
