AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI Trading Dashboard - single EC2 host (docker compose) deployed from GitHub Actions via SSM Run Command.
  No inbound SSH; use SSM Session Manager for shell access.

Parameters:
  AllowedCidr:
    Type: String
    Description: CIDR allowed to reach the dashboard on port 80 (your public IP, e.g. 203.0.113.10/32)
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro, t3.small, t3.medium]
    Description: Pick the type your account shows as "Free tier eligible" (t2.micro or t3.micro)
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  GitHubRepo:
    Type: String
    Default: raja521994@170508419/trading_Assistant@1454160446
    Description: Repository as it appears in the GitHub OIDC "sub" claim (owner@ownerId/repo@repoId)
  DeployBranch:
    Type: String
    Default: main
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if an IAM OIDC provider for token.actions.githubusercontent.com already exists in this account

Conditions:
  CreateOidc: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: trading-dashboard-host
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/trading-dashboard/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Trading dashboard HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Dashboard (redirects to HTTPS; also used by Lets Encrypt)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: Dashboard HTTPS (basic auth)

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # "standard" never bills extra CPU credits (t3 defaults to "unlimited")
        CreditSpecification: { CpuCredits: standard }
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1  # keeps containers away from the instance credentials
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: trading-dashboard }
        - { Key: App, Value: trading-dashboard }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.17.1/buildx-v0.17.1.linux-amd64 \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod +x /usr/local/lib/docker/cli-plugins/*
          systemctl enable --now docker
          # swap: the free-tier instance has only 1 GB RAM
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=3072
            chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          fi
          mkdir -p /opt/trading/releases /opt/trading/data

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}"
      Policies:
        - PolicyName: trading-dashboard-deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  DashboardUrl:
    Value: !Sub
      - "https://${Host}.sslip.io/"
      - Host: !Join ["-", !Split [".", !GetAtt Instance.PublicIp]]
    Description: Use as the Kite Redirect URL; changes if the instance is stopped/started (no Elastic IP)
  InstanceId:
    Value: !Ref Instance
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
